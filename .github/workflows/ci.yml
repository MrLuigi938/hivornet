name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [hive, honeypot]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # immer den neuesten Patch, damit govulncheck nicht an alten Standardbibliotheken scheitert
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Tests mit Race-Detector
        run: go test -race -count=1 ./...
      - name: Kurzes Fuzzing
        if: matrix.module == 'honeypot'
        run: |
          for f in FuzzReadRESP FuzzParseMySQLLogin FuzzReadLine FuzzHTTPRequestParsing FuzzTelnetReadLine FuzzRDP FuzzUDPParsers; do
            go test -run='^$' -fuzz="^$f\$" -fuzztime=20s .
          done

  scripts:
    name: Skripte und Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x install.sh update.sh uninstall.sh tools/*.sh pi/install.sh pi/rootfs/usr/local/sbin/*
      - name: hadolint
        run: |
          for f in hive/Dockerfile honeypot/Dockerfile; do
            docker run --rm -i hadolint/hadolint < "$f"
          done
      - name: docker compose config
        env:
          HONEYLITE_TOKEN: ci-test-token
        run: docker compose --profile cowrie config --quiet

  docker:
    name: Docker-Build (amd64, arm64, armv7)
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Hive bauen
        uses: docker/build-push-action@v6
        with:
          context: hive
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
      - name: Honeypot bauen
        uses: docker/build-push-action@v6
        with:
          context: honeypot
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
