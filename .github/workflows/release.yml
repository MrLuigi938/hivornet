name: Release

# Ein Tag wie v0.3.0 erzeugt eine Veröffentlichung mit allem, was man zum Betrieb braucht:
#
#   1. Docker-Images für amd64, arm64 und armv7 in der GitHub Container Registry
#      (ghcr.io/<owner>/hivornet-hive und -honeypot). Auf der NAS dann in .env
#      HIVORNET_VERSION setzen und in docker-compose.yml "build:" durch das
#      Registry-Image ersetzen (spart den Build auf der NAS).
#   2. Programmpakete hivornet-<tag>-linux-<arch>.tar.gz mit SHA256SUMS. Daraus
#      aktualisiert sich das Raspberry-Pi-Image selbst (Knopf in der Web-UI).
#   3. Raspberry-Pi-Images hivornet-pi-<arch>-<tag>.img.xz zum Aufspielen auf eine SD-Karte.
#
# Über "Run workflow" lässt sich das Pi-Image auch ohne Tag zum Testen bauen; es liegt
# dann als Artefakt am Lauf und nicht in einer Veröffentlichung.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Rechte je Job (M10 des dritten Audits): Nur "publish" darf die Veröffentlichung anlegen,
# nur "images" Pakete schreiben. Aus den Paketen aktualisieren sich Pis als root; eine
# kompromittierte Action in einem Bau-Job soll sie nicht ändern können. Actions sind per
# Commit-SHA festgelegt (Kommentar: Tag zum Zeitpunkt der Festlegung, 18.11.2026);
# checkout legt das Token nicht im Arbeitsordner ab.
permissions:
  contents: read

jobs:
  images:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [hive, honeypot]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hivornet-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  binaries:
    name: Programmpakete
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false
      - name: Bauen
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) tag="v0.0.0-test" ;; esac
          echo "TAG=$tag" >>"$GITHUB_ENV"
          mkdir -p out
          for arch in amd64 arm64 armv7; do
            goarch=$arch; goarm=""
            if [ "$arch" = armv7 ]; then goarch=arm; goarm=7; fi
            mkdir -p "dist/$arch"
            for c in hive honeypot; do
              (cd "$c" && CGO_ENABLED=0 GOOS=linux GOARCH=$goarch GOARM=$goarm \
                go build -trimpath -ldflags "-s -w -X main.version=${tag#v}" -o "../dist/$arch/$c" .)
            done
            printf '%s\n' "$tag" >"dist/$arch/VERSION"
            # Systemdateien des Pi-Images: übernimmt der Updater (hive install-system)
            sys="dist/$arch/system"
            mkdir -p "$sys/etc/systemd/system" "$sys/usr/local/sbin" "$sys/usr/lib/sysusers.d" "$sys/etc/NetworkManager/conf.d"
            cp pi/rootfs/etc/systemd/system/hivornet-* "$sys/etc/systemd/system/"
            cp pi/rootfs/usr/local/sbin/hivornet-* "$sys/usr/local/sbin/"
            cp pi/rootfs/usr/lib/sysusers.d/hivornet.conf "$sys/usr/lib/sysusers.d/"
            cp pi/rootfs/etc/NetworkManager/conf.d/hivornet-*.conf "$sys/etc/NetworkManager/conf.d/"
            chmod 755 "$sys"/usr/local/sbin/*
            tar -czf "out/hivornet-$tag-linux-$arch.tar.gz" -C "dist/$arch" hive honeypot VERSION system
          done
          (cd out && sha256sum hivornet-*.tar.gz >SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: programme
          path: |
            out/
            dist/
          retention-days: 7

  pi-image:
    name: Raspberry-Pi-Image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [binaries]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, armv7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: programme
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Image bauen
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) tag="v0.0.0-test" ;; esac
          # pyfatfs braucht pkg_resources; das fehlt in setuptools in neueren Versionen
          pip install "setuptools<80" pyfatfs==1.1.0
          # baut ohne Root: nur die FAT-Bootpartition wird geändert (pi/build_image.py)
          python3 pi/build_image.py --arch "${{ matrix.arch }}" --version "$tag" --bin "dist/${{ matrix.arch }}" --out .
          python3 pi/verify_image.py "hivornet-pi-${{ matrix.arch }}-$tag.img.xz" "$tag" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-image-${{ matrix.arch }}
          path: hivornet-pi-*
          retention-days: 7

  publish:
    name: Veröffentlichung
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [binaries, pi-image]
    permissions:
      contents: write # Veröffentlichung anlegen
    steps:
      # Nur die eigenen Artefakte laden: docker/build-push-action legt zusätzlich
      # *.dockerbuild-Protokolle ab, deren Download hier scheitert.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: programme
          path: all/programme
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pi-image-*
          path: all
      - name: Veröffentlichung anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tags mit Bindestrich (v0.4.0-beta.1, v0.4.0-rc.1) sind Vorabversionen: Sie erscheinen
          # nur bei Installationen, die in der UI den Kanal "Vorabversionen" gewählt haben.
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $pre --repo "$GITHUB_REPOSITORY" --title "Hivornet ${GITHUB_REF_NAME#v}" \
            --notes "Änderungen: siehe CHANGELOG.md. Raspberry Pi: Datei hivornet-pi-arm64-*.img.xz auf eine SD-Karte schreiben (README, Abschnitt Raspberry Pi)." \
            all/programme/out/hivornet-*.tar.gz all/programme/out/SHA256SUMS all/pi-image-*/hivornet-pi-*
