# Hält Go-Module, Basis-Images (inkl. Digests) und GitHub Actions aktuell.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /hive
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /honeypot
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /hive
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /honeypot
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
