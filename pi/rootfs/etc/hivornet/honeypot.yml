# Startkonfiguration des Honeypots auf dem Raspberry Pi.
# Gilt, bis in der Web-UI unter "Einstellungen" etwas gespeichert wird; danach gilt das.
#
# Auf dem Pi lauscht der Honeypot direkt auf den echten Ports. Im Router leitest
# du deshalb Port für Port 1:1 an den Pi weiter (extern 22 -> Pi 22 usw.).
# NIE weiterleiten: 8088 (Web-UI) und 8089. Den Pi nie als "Exposed Host" eintragen.
#
# Port 22 (SSH) und 23 (Telnet) gehören Cowrie (gefälschte Shell, eigener Dienst
# hivornet-cowrie). Der Go-Honeypot übernimmt 2222 (SSH-Tarpit) und 2323 (Telnet).

hostname: nas-backup01

listeners:
  - { service: ftp,        port: 21,   mode: emulate }
  - { service: smtp,       port: 25,   mode: emulate }
  - { service: http,       port: 80,   mode: emulate }
  - { service: https,      port: 443,  mode: emulate }
  - { service: ssh-tarpit, port: 2222, mode: tarpit }
  - { service: telnet,     port: 2323, mode: emulate }
  - { service: dockerapi,  port: 2375, mode: emulate }
  - { service: mysql,      port: 3306, mode: emulate }
  - { service: rdp,        port: 3389, mode: emulate }
  - { service: vnc,        port: 5900, mode: hybrid }
  - { service: redis,      port: 6379, mode: emulate }
  - { service: http,       port: 8080, mode: hybrid }
  - { service: raw,        port: 445,  mode: emulate }   # SMB-Scanner (nur erste Bytes)
  # UDP: zeichnen nur auf und antworten nie
  - { service: sip,        port: 5060, mode: emulate }
  - { service: snmp,       port: 161,  mode: emulate }
  - { service: dns,        port: 53,   mode: emulate, enabled: false }

tarpit:
  interval_ms: 10000
  max_conns: 2048        # ein Pi mit 1 GB RAM hält das gut aus
  max_per_ip: 32
  max_duration_min: 1440
