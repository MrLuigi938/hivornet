# Cowrie-Einstellungen von Hivornet auf dem Raspberry Pi.
# Alles, was hier nicht steht, nimmt Cowrie aus seinen mitgelieferten Standardwerten.
# Änderungen wirken nach: systemctl restart hivornet-cowrie

[honeypot]
hostname = nas-backup01
# Absolute Pfade: der Quelltext unter /opt ist zur Laufzeit nur lesbar.
# Downloads, Mitschnitte und Schlüssel liegen unterhalb von state_path.
log_path = /var/lib/hivornet-cowrie/log
state_path = /var/lib/hivornet-cowrie/lib
# Dateien, die Angreifer nachladen, höchstens 10 MB
download_limit_size = 10485760

[ssh]
listen_endpoints = tcp:22:interface=0.0.0.0

[telnet]
enabled = true
listen_endpoints = tcp:23:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
