# Hivornet: Hardware-Watchdog des Raspberry Pi. Bleibt das System stehen, startet der Pi nach
# 14 Sekunden selbst neu statt stundenlang zu hängen (bcm2835_wdt erlaubt höchstens 15 s).
# Hängt ein Neustart, erzwingt der Watchdog ihn nach 2 Minuten.
[Manager]
RuntimeWatchdogSec=14s
RebootWatchdogSec=2min
