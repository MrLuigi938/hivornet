# Hivornet: Systemprotokoll auf der SD-Karte behalten, damit nach einem Hänger oder Neustart
# nachlesbar ist, was passiert ist (Raspberry Pi OS hält es sonst nur im Arbeitsspeicher).
# Klein gehalten und gebündelt geschrieben, um die Karte zu schonen.
[Journal]
Storage=persistent
SystemMaxUse=64M
SystemMaxFileSize=8M
MaxRetentionSec=14day
SyncIntervalSec=5min
