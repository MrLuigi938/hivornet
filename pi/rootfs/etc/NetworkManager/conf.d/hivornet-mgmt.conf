# Hivornet: USB-Netzwerkadapter als Verwaltungsanschluss ins Heimnetz.
# Seine Standardroute und sein DNS zählen weniger als die des eingebauten Anschlusses
# (Gastnetz), damit Internet, Updates und GeoIP immer über das Gastnetz laufen. Ausgehende
# Verbindungen ins Heimnetz sperrt ohnehin hivornet-firewall.
[connection-hivornet-mgmt]
match-device=interface-name:eth1;interface-name:eth2;interface-name:eth3;interface-name:eth4;interface-name:eth5;interface-name:eth6;interface-name:eth7;interface-name:eth8;interface-name:eth9;interface-name:enx*
ipv4.route-metric=2000
ipv6.route-metric=2000
ipv4.dns-priority=500
ipv6.dns-priority=500
