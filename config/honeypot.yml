# Startkonfiguration des Go-Honeypots.
# Gilt bei jedem Start, bis der Hive eine Konfiguration liefert. Sobald einmal
# etwas unter "Einstellungen" in der Web-UI gespeichert ist, gilt das (der Hive
# speichert es, der Honeypot holt es alle 15 s ab). Diese Datei ist dann nur
# noch der Ausgangspunkt für einen frischen Hive.
#
# Dienste: ftp, http, https, dockerapi, mysql, redis, smtp, telnet, rdp, vnc,
#          ssh-tarpit, raw (generisch: zeichnet die ersten Bytes auf),
#          adb, mqtt, postgres, elasticsearch, ollama, kubernetes (API-Server und Kubelet);
#          UDP, nur aufzeichnen: sip, snmp, dns
#
# Modi:  emulate = nachspielen und aufzeichnen
#        tarpit  = Verbindung sofort festhalten (endlos langsame Daten)
#        hybrid  = erst Login/Anfrage aufzeichnen, dann festhalten
#
# "port" ist der echte Dienst-Port. Damit er von außen erreichbar ist, muss er in
# docker-compose.yml / .env auf einen NAS-Port gelegt werden (siehe README).
# Ports unter 1024 lauschen im Container auf Port+10000; 80 und 10080 gleichzeitig geht daher nicht.

hostname: nas-backup01

listeners:
  - { service: ftp,        port: 21,   mode: emulate }
  - { service: http,       port: 80,   mode: emulate }
  - { service: https,      port: 443,  mode: emulate }
  - { service: dockerapi,  port: 2375, mode: emulate }
  - { service: ssh-tarpit, port: 2222, mode: tarpit }
  - { service: mysql,      port: 3306, mode: emulate }
  - { service: vnc,        port: 5900, mode: hybrid }
  - { service: redis,      port: 6379, mode: emulate }
  - { service: http,       port: 8080, mode: hybrid }
  - { service: smtp,       port: 25,   mode: emulate }
  - { service: telnet,     port: 2323, mode: emulate }
  - { service: rdp,        port: 3389, mode: emulate }
  # UDP: zeichnen nur auf und antworten nie (kein Missbrauch für Reflexionsangriffe)
  - { service: sip,        port: 5060, mode: emulate }
  - { service: snmp,       port: 161,  mode: emulate }
  - { service: dns,        port: 53,   mode: emulate, enabled: false }
  # seit 0.7, zunächst aus: in docker-compose.yml schon freigegeben, hier oder unter Einstellungen einschalten
  - { service: adb,           port: 5555,  mode: emulate, enabled: false }
  - { service: mqtt,          port: 1883,  mode: emulate, enabled: false }
  - { service: postgres,      port: 5432,  mode: emulate, enabled: false }
  - { service: elasticsearch, port: 9200,  mode: emulate, enabled: false }
  - { service: ollama,        port: 11434, mode: emulate, enabled: false }
  - { service: kubernetes,    port: 6443,  mode: emulate, enabled: false }
  - { service: kubernetes,    port: 10250, mode: emulate, enabled: false }

tarpit:
  interval_ms: 10000     # alle 10 s ein winziges Datenstück
  max_conns: 4096        # gleichzeitig festgehaltene Verbindungen insgesamt (höchstens 8000)
  max_per_ip: 32         # pro Angreifer-IP
  max_duration_min: 1440 # nach 24 h wird losgelassen; 0 = unbegrenzt
